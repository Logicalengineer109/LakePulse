# LakePulse — local fixes for running this stack today. Picked up automatically by
# `docker compose up -d`; the original docker-compose.yaml is untouched.
#
# 1. MinIO deleted its images from Docker Hub (Sept 2026) and quay.io now
#    refuses anonymous pulls, so `minio/minio` and `minio/mc` no longer
#    resolve. pgsty/* are mirrors of the original images with the same
#    entrypoints, pinned to a release rather than :latest.
# 2. Recent `mc` dropped `config host add` and `policy set` in favour of
#    `alias set` and `anonymous set`, so the bucket bootstrap is restated.
# 3. Host port 8080 is already taken on this machine, so Trino's UI is
#    published on 8081. Inside iceberg_net it still listens on 8080, so
#    Superset's URI (trino://trino@trino:8080/iceberg/db) is unchanged.

services:
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z

  mc:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 admin password) do echo '...waiting for minio...' && sleep 1; done;
      /usr/bin/mc rm -r --force minio/warehouse;
      /usr/bin/mc mb --ignore-existing minio/warehouse;
      /usr/bin/mc anonymous set public minio/warehouse;
      tail -f /dev/null
      "

  # The Flink SQL job and the dashboard address the catalog as `iceberg-rest`,
  # which used to resolve only because that was the container name. Pin it as an
  # explicit network alias so the hostname survives container renaming.
  rest:
    networks:
      iceberg_net:
        aliases:
          - iceberg-rest

  trino:
    # !override replaces the base list; a plain `ports:` would merge
    # with it and 8080 would still be published.
    ports: !override
      - 8081:8080

  # LakePulse dashboard: single unified web UI over the whole pipeline, on http://localhost:8090
  dashboard:
    container_name: lakepulse-dashboard
    build:
      context: ./dashboard
    ports:
      - 8090:8090
    environment:
      TRINO_HOST: trino
      TRINO_PORT: 8080
      FLINK_URL: http://jobmanager:18081
      MINIO_URL: http://minio:9000
      ICEBERG_REST_URL: http://iceberg-rest:8181
      KAFKA_BROKER: broker:29092
    depends_on:
      - trino
      - jobmanager
    networks:
      - iceberg_net
